# Self-hosted iroh relay config (PLAN-152 T4, ADR-020 §8): plain HTTP on purpose.
# TLS is terminated by the Coolify proxy; never publish this port without it.
# QUIC address discovery needs TLS on the relay itself, so it is off behind a proxy.
http_bind_addr = "0.0.0.0:3340"
enable_relay = true
enable_quic_addr_discovery = false
enable_metrics = false

# Access: open to every iroh endpoint by default. Traffic stays end-to-end encrypted, but
# anyone who finds the URL can use the relay's bandwidth. To restrict it to your devices,
# list their endpoint ids (`endpointId` in each daemon's `GET /v1/mesh`) and rebuild:
# access.allowlist = [
#   "<endpoint id>",
# ]
