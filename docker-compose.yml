# Local development stack. `pnpm install && pnpm dev` directly on the host is still
# the fastest inner loop (instant HMR, no container overhead) — this exists for a
# consistent, no-local-Node-required path, and to develop against a real Postgres
# without installing it on the host.
#
# Usage: copy .env.example to .env (set VAULT_PATH to a real markdown vault, e.g. this
# Foam vault), then `docker compose up`. Optional: VAULT_READONLY=true to reject writes.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: pnpm --filter @fluffmind/web dev
    ports:
      - '3000:3000'
    environment:
      VAULT_PATH: /vault
      VAULT_READONLY: ${VAULT_READONLY:-}
      SYNC_MODE: ${SYNC_MODE:-}
      SYNC_WRITER_DEVICE: ${SYNC_WRITER_DEVICE:-}
      # Nuxt -> `sync` over the compose network only (the daemon port is not published).
      FLUFFMIND_DAEMON_URL: ${FLUFFMIND_DAEMON_URL:-http://sync:8787}
      FLUFFMIND_DAEMON_TOKEN: ${FLUFFMIND_DAEMON_TOKEN:-dev-daemon-token}
      GIT_REMOTE_URL: ${GIT_REMOTE_URL:-}
      GIT_BRANCH: ${GIT_BRANCH:-main}
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      AUTH_PUBLIC_SIGNUP: ${AUTH_PUBLIC_SIGNUP:-}
      WORKSPACES_ROOT: /data/workspaces
      LOCK_WAIT_MS: ${LOCK_WAIT_MS:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_SYNC_TOKEN_SECRET: ${GITHUB_SYNC_TOKEN_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-fluffmind}:${POSTGRES_PASSWORD:-fluffmind}@postgres:5432/${POSTGRES_DB:-fluffmind}
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: '3000'
    volumes:
      - .:/app
      # Read-write since P1: writeToWorkspace commits (and optionally pushes) here.
      - ${VAULT_PATH}:/vault
      # P2 workspace root (one directory per organization id).
      - workspaces-data:/data/workspaces
      # Anonymous volumes so the image's own (Linux-native) node_modules aren't
      # shadowed by the bind mount above — needed for every workspace package since
      # pnpm installs a node_modules per package, not just at the repo root.
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.nuxt
      - /app/packages/design-system/node_modules
      - /app/packages/editor-blocks/node_modules
      - /app/packages/integrations/node_modules
      - /app/packages/db/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  # Rust sync daemon (ADR-020 §9): a separate service from `web`, same /vault and
  # workspaces volumes. No published port: only `web` reaches it, with the bearer token.
  sync:
    build:
      context: .
      dockerfile: Dockerfile
      target: daemon
    restart: unless-stopped
    # The bind-mounted vault is host/root-owned in dev (web runs as root here too).
    user: root
    command: ['--host', '0.0.0.0', '--vault', '/vault']
    environment:
      # Dev-only default, safe because the port is internal; set a real one in .env.
      FLUFFMIND_DAEMON_TOKEN: ${FLUFFMIND_DAEMON_TOKEN:-dev-daemon-token}
      FLUFFMIND_RELAY_URL: ${FLUFFMIND_RELAY_URL:-}
      FLUFFMIND_MESH_DIRECT: ${FLUFFMIND_MESH_DIRECT:-}
      FLUFFMIND_SYNC_INTERVAL_SECS: ${FLUFFMIND_SYNC_INTERVAL_SECS:-}
      SYNC_WRITER_DEVICE: ${SYNC_WRITER_DEVICE:-}
    volumes:
      - ${VAULT_PATH}:/vault
      - workspaces-data:/data/workspaces
      # Node key = peer identity: keep it across rebuilds.
      - sync-data:/data/daemon
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8787/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional self-hosted iroh relay (ADR-020 §8): `docker compose --profile relay up`.
  # Plain HTTP on 3340 (dev); production TLS goes through the Coolify proxy.
  relay:
    profiles: [relay]
    build:
      context: .
      dockerfile: Dockerfile
      target: relay
    restart: unless-stopped
    ports:
      - '3340:3340'

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fluffmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluffmind}
      POSTGRES_DB: ${POSTGRES_DB:-fluffmind}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d ${POSTGRES_DB:-fluffmind}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  workspaces-data:
  sync-data:
